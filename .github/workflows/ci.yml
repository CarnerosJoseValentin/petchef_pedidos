name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Setup Java (necesario para el emulador de Firestore)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Instalar dependencias (raíz)
        run: npm install

      - name: Instalar dependencias (functions)
        run: npm --prefix functions install

      - name: Build de Next.js
        run: npm run build
        env:
          # Valores dummy: alcanza para validar que compila, no se
          # despliega nada con estos valores. No son secretos reales.
          NEXT_PUBLIC_FIREBASE_API_KEY: AIzaSyDUMMYKEYFORBUILDTESTONLY000000
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: dummy.firebaseapp.com
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: dummy-project
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: dummy.appspot.com
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "123456789"
          NEXT_PUBLIC_FIREBASE_APP_ID: "1:123456789:web:abc123"

      - name: Tests de reglas de Firestore
        run: npm run test:rules

      - name: Tests de Cloud Functions
        run: npm run test:functions
